name: materialize-poster
on:
  workflow_dispatch:
jobs:
  materialize:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Decode poster-nov21.jpg and push
        run: |
          set -euo pipefail
          base64 -d poster-nov21.jpg.b64 > poster-nov21.jpg
          test -s poster-nov21.jpg
          ls -l poster-nov21.jpg
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add poster-nov21.jpg
          git commit -m "Add poster-nov21.jpg for Buffer scheduling"
          git push
