name: materialize-reel
on:
  workflow_dispatch:
jobs:
  materialize:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Decode parts into reel-nov22.mp4 and push
        run: |
          set -euo pipefail
          cat parts/*.txt | base64 -d > reel-nov22.mp4
          test -s reel-nov22.mp4
          ls -l reel-nov22.mp4
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reel-nov22.mp4
          git commit -m "Add reel-nov22.mp4 for Buffer scheduling"
          git push
